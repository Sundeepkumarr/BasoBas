version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hamroawas-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hamroawas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hamroawas-network

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: hamroawas-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - hamroawas-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hamroawas-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - hamroawas-network

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hamroawas-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hamroawas?schema=public
      MONGODB_URI: mongodb://mongodb:27017/hamroawas
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - mongodb
      - redis
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - hamroawas-network

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hamroawas-client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - hamroawas-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  hamroawas-network:
    driver: bridge
