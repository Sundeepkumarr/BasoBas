services:
  - type: web
    runtime: node
    name: hamroawas-app
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build && cd ../server && npm install && npm run db:generate && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hamroawas-db
          property: connectionString
      - key: CLIENT_URL
        value: https://hamroawas-1gh.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: "10485760"

databases:
  - name: hamroawas-db
    plan: free
